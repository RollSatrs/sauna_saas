[package]
name = "sauna-pos"
version = "0.1.0"
description = "Касса для бань и саун"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sauna_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
